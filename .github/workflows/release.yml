name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'

    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: 'tauri-release-${{ matrix.target }}'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Prepare Apple notarization API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY" ]; then
            KEY_DIR="${{ runner.temp }}/private_keys"
            mkdir -p "$KEY_DIR"
            KEY_PATH="$KEY_DIR/AuthKey_${APPLE_API_KEY}.p8"
            echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          fi

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: ${{ github.event.inputs.tag_name || github.ref_name }}
          releaseName: 'Vecway ${{ github.event.inputs.tag_name || github.ref_name }}'
          releaseBody: |
            ### 下载与安装 / Download
            - **Apple Silicon (M1–M5)**: 下载 `*aarch64.dmg`（推荐） / Download `*aarch64.dmg` (Recommended)
            - **Intel Mac**: 下载 `*x64.dmg`
            - 打开 `.dmg` 后将 `Vecway.app` 拖入「应用程序」即可使用（`.app.tar.gz` 与 `.sig` 供应用内自动更新使用）。
            - Drag `Vecway.app` into **Applications** to install (`.app.tar.gz` and `.sig` are for the built-in updater).

            > **系统与引擎**：macOS 12.0+；首次启动将自动安装底层 [`omp`](https://github.com/can1357/oh-my-pi) CLI 引擎。  
            > **Requirements**: macOS 12.0+; installs the [`omp`](https://github.com/can1357/oh-my-pi) CLI automatically on first launch if missing.

            ---

            ### 本次更新 / What's New
            #### 新增功能 / Features
            - **macOS 权限引导弹窗**：在「设置 → 通用」新增辅助功能、屏幕录制与完全磁盘访问权限状态检查及系统设置直达引导。
            - **macOS Permissions Guide**: Added status probes and System Settings deep links for Accessibility, Screen Recording, and Full Disk Access in General Settings.
            - **文件浏览、预览与搜索体验增强**：文件树合并为紧凑单行工具栏，支持隐藏点文件/构建目录、自动刷新与定位预览文件；支持右侧面板临时最大化、目录链接直接定位，以及全局 `/` 快捷键快速搜索。
            - **Explorer, Preview & Search**: Consolidated the file explorer header into a compact toolbar with dotfile/build filtering, auto-refresh, active-file reveal, right-panel maximize, directory link navigation, and scoped `/` search shortcuts.
            - **定时自动化草稿与交互升级**：新增定时任务草稿面板、统一表单/问答确认面板，并优化供应商模型搜索与记忆开关设置。
            - **Automations & Chat Interactions**: Added the automation drafts panel, unified ask-form step navigation, provider model search/batch actions, and explicit memory enablement toggle.

            #### 修复与优化 / Fixes & Performance
            - **性能与内存大幅瘦身**：精简前端与移动端包体积、按需懒加载弹窗、批处理 RPC 事件帧并优化流式渲染与手绘草图热路径。
            - **Frontend & Mobile Performance**: Trimmed bundle sizes, gated lazy overlays, batched RPC frames, and optimized streaming and sketch rendering hot paths.
            - **后端安全与并发加固**：改为按会话独立加锁、有界子代理与缓存读取、SQLite/磁盘扫描隔离、更稳健的进程超时与资源上限控制。
            - **Backend Security & Concurrency**: Switched to per-session startup locks, bounded caches/process limits, offloaded SQLite/catalog scans, and hardened provider/mobile authorization.
            - **桌面端细节修复**：优化待审阅计划自动弹出、子代理分段计时与多处布局/主题对比度细节。
            - **Desktop Polish**: Refined plan panel auto-open lifecycle, multi-segment subagent run timing, and layout/theme contrast details.

            ---

            ### 帮助与反馈 / Support
            - [在线用户手册](https://github.com/qian-123456/vecway/tree/main/docs/guide/zh) · [GitHub Issues](https://github.com/qian-123456/vecway/issues)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
