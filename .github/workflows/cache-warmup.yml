name: Cache Warmup (main)

on:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/cache-warmup.yml'
      - '.github/workflows/release.yml'
  schedule:
    # GitHub Actions evicts caches not accessed within 7 days; keep main caches warm.
    - cron: '0 3 */5 * *'
  workflow_dispatch:

concurrency:
  group: cache-warmup-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warmup:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        target:
          - 'aarch64-apple-darwin'
          - 'x86_64-apple-darwin'

    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: 'tauri-release-${{ matrix.target }}'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Warm up Rust & frontend build cache
        run: pnpm tauri build --no-bundle --no-sign --config '{"bundle":{"createUpdaterArtifacts":false}}' --target ${{ matrix.target }}
